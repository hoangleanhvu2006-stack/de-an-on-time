<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Không tìm thấy trang | On Time</title><meta name="robots" content="noindex">
<meta property="og:url" content="https://hoangleanhvu2006-stack.github.io/de-an-on-time/404.html">
<meta property="og:type" content="website">
<meta property="og:locale" content="vi_VN">
<meta property="og:site_name" content="On Time">
<meta property="og:image" content="https://hoangleanhvu2006-stack.github.io/de-an-on-time/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310203A'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23FFE14D' stroke-width='2.5'/%3E%3Cpath d='M16 10v6l4 3' stroke='%23FFE14D' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Nhìn là hiểu: mỗi khối một hình hoặc một biểu tượng, chữ ngắn; điểm nhấn duy nhất là màu bút dạ quang trên nền giấy lạnh */
  --giay:#F4F7FB; --trang:#FFFFFF; --muc:#10203A; --chi:#56677F; --ke:#D3DBE8; --nhat:#E7EDF6;
  --da-quang:#FFE14D; --dung-gio:#0B8A6A; --xanh-chu:#087257; --xanh-nhat:#DDF3EC; --canh-bao:#C8371F;
  --chu:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--giay);color:var(--muc);font-family:var(--chu);font-size:17px;line-height:1.55}
a{color:inherit}
:focus-visible{outline:3px solid var(--dung-gio);outline-offset:2px;border-radius:6px}
.khung{max-width:1080px;margin:0 auto;padding:0 20px}
.bao{background:var(--muc);color:#fff;font-size:13.5px;padding:7px 0;line-height:1.45}
.bao b{color:var(--da-quang)}
header.dau{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:16px 0}
.ten{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;text-decoration:none}
.ten i{width:30px;height:30px;border-radius:8px;background:var(--muc);display:grid;place-items:center}
.ten i::before{content:"";width:16px;height:16px;border:2.5px solid var(--da-quang);border-radius:50%;background:linear-gradient(var(--da-quang),var(--da-quang)) 50% 30%/2.5px 6px no-repeat}
nav.muc{display:flex;gap:4px;font-size:16px;background:var(--trang);border:1px solid var(--ke);border-radius:99px;padding:4px}
nav.muc a{text-decoration:none;color:var(--chi);padding:7px 16px;border-radius:99px;font-weight:500}
nav.muc a:hover{color:var(--muc)}
nav.muc a[aria-current]{background:var(--muc);color:#fff;font-weight:700}
h1{font-size:clamp(34px,5vw,52px);line-height:1.08;font-weight:800;margin:0 0 16px;text-wrap:balance;letter-spacing:-.015em}
h2{font-size:clamp(24px,3vw,30px);line-height:1.2;font-weight:800;margin:0 0 6px;text-wrap:balance}
h3{font-size:17px;line-height:1.3;margin:0 0 4px}
p{margin:0 0 12px;max-width:60ch}
.dan{font-size:19px;color:var(--chi)}
.phu{color:var(--chi);margin:0 0 22px}
.nho{font-size:14px;color:var(--chi)}
section{padding:44px 0}
.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--nhat);flex:none}
.ic.vang{background:var(--da-quang)} .ic.xanh{background:var(--xanh-nhat);color:var(--xanh-chu)} .ic.dam{background:var(--muc);color:var(--da-quang)}
.nut{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:13px 20px;font:700 16px var(--chu);cursor:pointer;text-decoration:none;background:var(--muc);color:#fff;margin:0 8px 8px 0}
.nut.phu-n{background:transparent;color:var(--muc);box-shadow:inset 0 0 0 2px var(--muc)}
.nut.vang{background:var(--da-quang);color:var(--muc)}
.luoi{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.luoi>*{min-width:0}
.o{background:var(--trang);border:1px solid var(--ke);border-radius:16px;padding:18px}
.o p{margin:0;color:var(--chi);font-size:15.5px;max-width:none}
.o .ic{margin-bottom:12px}
.vach{height:10px;background:var(--nhat);border-radius:99px;overflow:hidden}
.vach i{display:block;height:100%;background:var(--muc);border-radius:99px}
.cot{display:grid;gap:16px;max-width:720px}
.cot .dong{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.cot b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
footer{background:var(--muc);color:#C9D3E3;padding:26px 0;font-size:14.5px;margin-top:28px}
footer a{color:#fff}
footer p{max-width:70ch;margin:0 0 8px}
@media (max-width:520px){nav.muc a{padding:7px 12px;font-size:15px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.giua{min-height:70vh;display:grid;place-items:center;text-align:center}
</style></head><body><div class="khung"><main class="giua"><div><span class="ic vang" style="width:64px;height:64px;margin-bottom:16px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><h1>Trang này không có.</h1><p class="dan" style="margin:0 auto 18px">Có thể đường dẫn bị gõ thiếu.</p><p style="margin:0 auto"><a class="nut" href="https://hoangleanhvu2006-stack.github.io/de-an-on-time/">Về trang On Time</a></p></div></main></div></body></html>
